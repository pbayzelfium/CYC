name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    # A clean Windows box. The point of this job is the install-from-nothing
    # path, which cannot be checked on a machine that already has everything.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer parses
        shell: pwsh
        run: |
          $errs = $null
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'test-install.ps1', 'cyc-protocol.ps1') {
            $path = Join-Path $PWD $f
            if (-not (Test-Path $path)) { $path = Join-Path $PWD "src/.oh-my-posh/$f" }
            if (-not (Test-Path $path)) { Write-Error "missing $f"; exit 1 }
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error "$f : $($_.Message)" }; exit 1 }
            Write-Host "$f parses"
          }

      - name: Nothing that looks like a packer
        shell: pwsh
        run: |
          # The installer used to carry its files as base64. That is the shape
          # antivirus flags, so it now fetches plain text - and must stay that way.
          $t = Get-Content install.ps1 -Raw
          if ($t -match 'FromBase64String') { Write-Error "install.ps1 decodes base64 again"; exit 1 }
          if ((Get-Item install.ps1).Length -gt 60kb) { Write-Error "install.ps1 got big - is something embedded?"; exit 1 }
          if ($t -match 'irm\s+\S+\s*\|\s*iex') { Write-Error "install.ps1 pipes a download into iex"; exit 1 }
          Write-Host "install.ps1 is $([math]::Round((Get-Item install.ps1).Length/1kb)) KB, nothing encoded"

      - name: Every file the manifest names exists
        shell: pwsh
        run: |
          $t = Get-Content install.ps1 -Raw
          $m = [regex]::Match($t, '(?s)\$Manifest = \[ordered\]@\{(.*?)\n\}')
          if (-not $m.Success) { Write-Error "no manifest found"; exit 1 }
          $n = 0; $bad = 0
          foreach ($line in ($m.Groups[1].Value -split "`n")) {
            if ($line -notmatch "'([^']+)'\s*=") { continue }
            $dest = $Matches[1]; $n++
            if (-not (Test-Path (Join-Path "src" $dest))) { Write-Error "manifest names a missing file: $dest"; $bad++ }
          }
          if ($n -lt 10) { Write-Error "only $n manifest entries"; exit 1 }
          if ($bad) { exit 1 }
          Write-Host "$n manifest entries, all present in src/"

      - name: Dry run changes nothing
        shell: pwsh
        run: pwsh -NoProfile -File install.ps1 -DryRun -Source "$PWD/src"

      - name: -Force survives the relaunch into PowerShell 7
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'relaunch'
          New-Item -ItemType Directory -Force (Join-Path $root '.oh-my-posh') | Out-Null
          Set-Content (Join-Path $root '.oh-my-posh\palettes.json') '{}'

          # Start from Windows PowerShell 5.1, which is what the README tells
          # people to use, so the installer has to hand itself over to 7.
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $out = & $ps51 -ExecutionPolicy Bypass -NoProfile -File install.ps1 `
                   -TestRoot $root -Source "$PWD/src" -Force -NoOpen 2>&1 | Out-String

          if ($out -match 'would install PowerShell 7') {
            Write-Host 'no PowerShell 7 on this runner - nothing to hand over to'; exit 0
          }
          if ($out -notmatch 'restarting in PowerShell 7') {
            Write-Host $out; Write-Error 'expected a handover from 5.1'; exit 1
          }
          $after = $out.Substring($out.IndexOf('restarting in PowerShell 7'))
          if ($after -match 'already installed') {
            Write-Host $out
            Write-Error '-Force did not survive the relaunch: the second run refused to upgrade'
            exit 1
          }
          Write-Host 'flags survived the handover'

      - name: The published version is real and stamped in
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { Write-Error "bad VERSION: '$v'"; exit 1 }
          $i = Get-Content install.ps1 -Raw
          if ($i -match '__VERSION__') {
            Write-Error 'the version token was not substituted - the update check would never fire'
            exit 1
          }
          if ($i -notmatch [regex]::Escape("`$CycVersion = '$v'")) {
            Write-Error "install.ps1 was not built from VERSION $v - run build-installer.py"
            exit 1
          }
          Write-Host "VERSION $v, stamped in"

      - name: Test suite
        shell: pwsh
        run: pwsh -NoProfile -File test-install.ps1

      - name: Real install into a clean profile
        shell: pwsh
        run: |
          # -Source: install the code in this commit, not whatever main happens
          # to serve. The runner has no Windows Terminal, so that step warns and
          # is skipped; everything else runs for real, including the downloads.
          pwsh -NoProfile -File install.ps1 -SkipCatalogue -NoOpen -Source "$PWD/src"
          if (-not (Test-Path "$HOME/.local/bin/oh-my-posh.exe")) {
            Write-Error "oh-my-posh was not installed"; exit 1
          }
          $themes = @(Get-ChildItem "$HOME/.oh-my-posh/themes" -Filter *.omp.json)
          if ($themes.Count -lt 50) { Write-Error "theme collection missing"; exit 1 }
          Write-Host "oh-my-posh + $($themes.Count) designs installed"

      - name: The installed prompt actually renders
        shell: pwsh
        run: |
          $omp = "$HOME/.local/bin/oh-my-posh.exe"
          foreach ($cfg in Get-ChildItem "$HOME/.oh-my-posh" -Filter 'cyc-*.omp.json') {
            $out = & $omp print primary --config $cfg.FullName --shell pwsh --plain
            if (-not $out) { Write-Error "$($cfg.Name) rendered nothing"; exit 1 }
          }
          Write-Host "every generated prompt renders"

      - name: Recolouring works end to end
        shell: pwsh
        run: |
          python "$HOME/.oh-my-posh/pair-prompt.py" agnoster nord
          $f = "$HOME/.oh-my-posh/paired/agnoster@nord.omp.json"
          if (-not (Test-Path $f)) { Write-Error "no paired config produced"; exit 1 }
          $pal = (Get-Content "$HOME/.oh-my-posh/palettes.json" -Raw | ConvertFrom-Json).nord
          $allowed = @($pal.PSObject.Properties | Where-Object { $_.Name -ne 'scheme' } |
                       ForEach-Object { $_.Value.ToLower() })
          $used = [regex]::Matches((Get-Content $f -Raw), '#[0-9a-fA-F]{6}') |
                  ForEach-Object { $_.Value.ToLower() } | Sort-Object -Unique
          $stray = @($used | Where-Object { $allowed -notcontains $_ })
          if ($stray.Count) { Write-Error "colours outside the palette: $($stray -join ', ')"; exit 1 }
          Write-Host "$($used.Count) colours, all inside the nord palette"

      - name: The cyc:// handler refuses bad input
        shell: pwsh
        run: |
          # A protocol handler is a way for a web page to reach this machine, so
          # the refusals matter as much as the successes.
          $h = "$HOME/.oh-my-posh/cyc-protocol.ps1"
          $bad = @(
            'cyc://apply?theme=../../evil',
            'cyc://apply?theme=nord&design=;calc.exe',
            'cyc://apply?theme=nord&b=999',
            'cyc://apply?theme=not-a-real-theme',
            'https://example.com/apply?theme=nord',
            'cyc://evil?theme=nord',
            'cyc://?theme=nord'
          )
          foreach ($u in $bad) {
            pwsh -NoProfile -File $h $u -WhatIfOnly *> $null
            if ($LASTEXITCODE -eq 0) { Write-Error "handler ACCEPTED: $u"; exit 1 }
            Write-Host "refused: $u"
          }
          pwsh -NoProfile -File $h 'cyc://apply?theme=nord&design=agnoster&b=-10' -WhatIfOnly *> $null
          if ($LASTEXITCODE -ne 0) { Write-Error "handler refused a valid url"; exit 1 }
          Write-Host "accepted a valid url"

          # An update is the one action a dry run must not perform.
          pwsh -NoProfile -File $h 'cyc://update' -WhatIfOnly *> $null
          if ($LASTEXITCODE -ne 0) { Write-Error "handler refused cyc://update"; exit 1 }
          if (Test-Path "$env:TEMP/cyc-update-run.ps1") {
            Write-Error "cyc://update ran under -WhatIfOnly"; exit 1
          }
          Write-Host "cyc://update stayed a dry run"
